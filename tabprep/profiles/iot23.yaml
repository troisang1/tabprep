name: iot23
version: 1.0.0
description: |
  IoT-23 (Stratosphere Lab, CTU Prague, 2020) — real IoT malware
  captures on the Zeek `conn.log` schema. 23 captures, multi-class via
  `detailed-label` (Mirai variants, Okiru, Torii, C&C, DDoS,
  PartOfAHorizontalPortScan, etc.). Total ~325M flows; subsampled
  here. Distinct from CIC-style captures because the data is real
  malware running on real devices, not emulated traffic.

# v0.5 schema: short downloader/loader names looked up in the
# tabprep.datasets registries. The downloader fetches the
# Stratosphere lite tarball; the loader handles IoT-23's mixed-tab/
# space conn.log.labeled format.
downloader: iot23
loader: iot23
cached_at: raw/iot23/
loader_options:
  per_file_cap: 50000     # head-N per capture; bounds RAM (some
                          # captures have >100M flows each)

label:
  source_column: detailed-label
  rename_to: label
  normalize: lowercase_underscore

pipeline:
  # The Zeek schema has a `label` column with values Malicious/Benign
  # and a `detailed-label` column with the actual attack family. We use
  # the latter as the multi-class target; rename_label drops the binary
  # `label` automatically when `detailed-label` is renamed to `label`.
  - op: drop_columns
    columns: [ts, uid, tunnel_parents]         # timestamp + identifiers
  - op: drop_ip_columns                        # id.orig_h, id.resp_h
  - op: encode_categoricals
    max_cardinality: 50
    method: onehot
  - op: coerce_numeric
  - op: replace_inf
  - op: drop_high_nan_columns
    threshold: 0.8
  - op: fill_nan
    value: 0
  - op: filter_min_class_count
    min_count: 50
  - op: balanced_subsample
    max_total: 1000000
    seed: 42

split:
  kind: stratified_class_balanced
  train_frac: 0.6
  cal_frac:   0.2
  test_frac:  0.2
  seed: 42

output:
  format: csv
  precision: 6
  column_sort: alphabetical
  row_shuffle_seed: 42

# Pinned against the Stratosphere lite tarball (~9.4 GB) extracted
# under data/raw/iot23/. Re-pin if you change loader_options or the
# pipeline.
expected_hashes:
  calibration.csv: 55a6e6ce5207f14b2961d180a93987d088a7df001974a529f6876cbb6e766826
  test.csv: d3a859c6d3bde2ea9da4cad789b277917310f3e509d1460113531839418f76f3
  train.csv: 6342e8b5bd708460ff229f32362d6b452b010f763e16c41000b6b3ba02b7c1ec
