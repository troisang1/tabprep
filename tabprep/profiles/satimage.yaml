name: satimage
version: 1.0.0
description: Statlog (Landsat Satellite) image (6 classes, 36 features) — OpenML

downloader: openml
loader: openml
cached_at: raw/openml/satimage/
loader_options:
  openml_name: satimage
  openml_version: 1

label:
  source_column: label
  rename_to: label
  normalize: lowercase_underscore

pipeline:
  - op: rename_features_f0fN
  - op: filter_min_class_count
    min_count: 50

split:
  kind: stratified_class_balanced
  train_frac: 0.5
  cal_frac:   0.1
  test_frac:  0.4
  seed: 42

output:
  format: csv
  precision: 6
  column_sort: alphabetical
  row_shuffle_seed: 42

expected_hashes:
  calibration.csv: 38cc395c374842567fdf582d88851d7f9fadce8437f06a7b85aa0fac5d271e05
  test.csv: 9bf14bc661417302cff9d1c92e1d511a660a1ef8fc6d094aabe65f7a98ba9be3
  train.csv: 095873519aabb29e518e4573226f65e71ca6cbb5c32b682acb0f329e2947a17d
