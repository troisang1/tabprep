name: bot_iot
version: 1.0.0
description: |
  Bot-IoT (Koroniotis et al., 2018) — UNSW Canberra IoT botnet flows.
  One of the most-cited IoT IDS datasets. Multi-class taxonomy
  (DDoS / DoS / Reconnaissance / Theft / Normal).

  AARNet's Cloudstor host (where UNSW originally distributed Bot-IoT)
  was decommissioned in 2023; this profile uses the OpenML mirror
  (id 42072, `bot-iot-all-features`) which is the 10-best-features
  subset most papers cite. No consent form required for the OpenML
  mirror.

downloader: bot_iot
loader: bot_iot
cached_at: raw/bot_iot/
loader_options:
  openml_name: bot-iot-all-features
  openml_version: 1

label:
  source_column: category
  rename_to: label
  normalize: lowercase_underscore

pipeline:
  - op: encode_categoricals      # the OpenML mirror has been pre-cleaned;
                                 # category is the only non-numeric column
                                 # we'd encode (it's the label so it's skipped).
    max_cardinality: 50
    method: onehot
  - op: coerce_numeric
  - op: replace_inf
  - op: fill_nan
    value: 0
  - op: filter_min_class_count
    min_count: 50
  - op: balanced_subsample
    max_total: 200000
    seed: 42

split:
  kind: stratified_class_balanced
  train_frac: 0.6
  cal_frac:   0.2
  test_frac:  0.2
  seed: 42

output:
  format: csv
  precision: 6
  column_sort: alphabetical
  row_shuffle_seed: 42

# expected_hashes pinned after the first canonical run.
