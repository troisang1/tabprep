name: bot_iot
version: 1.0.0
description: |
  Bot-IoT (Koroniotis et al., 2018) — UNSW Canberra IoT botnet flows.
  One of the most-cited IoT IDS datasets. Multi-class taxonomy
  (DDoS / DoS / Reconnaissance / Theft / Normal).

  AARNet's Cloudstor host (where UNSW originally distributed Bot-IoT)
  was decommissioned in 2023, and the UNSW SharePoint replacement
  returns HTTP 403 to non-browser clients. This profile auto-fetches
  the Kaggle public mirror `vigneshvenkateswaran/bot-iot-5-data` —
  the canonical 5% subset (~57 MB ZIP, ~1 GB extracted across 4
  reduced_data_*.csv files; full 46-column schema). Strictly more
  useful than the OpenML 10-best-features mirror this previously used.

downloader: bot_iot
loader: bot_iot
cached_at: raw/bot_iot/
loader_options: {}

label:
  source_column: category
  rename_to: label
  normalize: lowercase_underscore
  # Bot-IoT ships three mutually-derived targets: `attack` (binary 0/1),
  # `category` (multi-class family, the target here), and `subcategory`
  # (specific attack). The other two MUST be dropped or they leak the
  # answer into the feature set.
  also_drop: [attack, subcategory]

pipeline:
  # `pkSeqID` is a row index and `seq` an Argus sequence number — flow
  # identifiers, not features. (`stime` / `ltime` are handled by
  # `drop_timestamp_columns` below.)
  - op: drop_columns
    columns: [pkSeqID, seq]
  # `saddr` / `daddr` are the source/destination IPs (~20 unique in this
  # testbed — small enough to one-hot and leak host identity); the
  # `*SrcIP` / `*DstIP` engineered aggregates go too.
  - op: drop_ip_columns
  - op: drop_timestamp_columns           # stime / ltime (capture wall-clock)
  - op: encode_categoricals      # the OpenML mirror has been pre-cleaned;
                                 # category is the only non-numeric column
                                 # we'd encode (it's the label so it's skipped).
    max_cardinality: 50
    method: onehot
  - op: coerce_numeric
  - op: replace_inf
  - op: fill_nan
    value: 0
  - op: filter_min_class_count
    min_count: 50
  # Standardised 5% stratified benchmark slice — preserves the
  # upstream class proportions (no rebalancing).
  - op: stratified_fraction_sample
    fraction: 0.05
    seed: 42

split:
  kind: stratified_class_balanced
  train_frac: 0.6
  cal_frac:   0.2
  test_frac:  0.2
  seed: 42

output:
  format: csv
  precision: 6
  column_sort: alphabetical
  row_shuffle_seed: 42

# expected_hashes pinned after the first canonical run.
