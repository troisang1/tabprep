name: pendigits
version: 1.0.0
description: Pen-based handwritten digits (10 classes, 16 features) — OpenML

# v0.5 schema: short downloader/loader names looked up in the
# tabprep.datasets registries. The downloader pre-fetches the OpenML
# bytes via sklearn (writes a `_complete` marker under cached_at);
# the loader assembles `(df, label)` from `fetch_openml(...)`.
downloader: openml
loader: openml
cached_at: raw/openml/pendigits/
loader_options:
  openml_name: pendigits
  openml_version: 1

label:
  source_column: label
  rename_to: label
  normalize: lowercase_underscore

pipeline:
  - op: rename_features_f0fN
  - op: filter_min_class_count
    min_count: 50

split:
  kind: stratified_class_balanced
  train_frac: 0.5
  cal_frac:   0.1
  test_frac:  0.4
  seed: 42

output:
  format: csv
  precision: 6
  column_sort: alphabetical
  row_shuffle_seed: 42

# Pinned against `fetch_openml("pendigits", version=1, as_frame=True,
# parser="auto")`. Re-pin if the loader/op contract changes.
expected_hashes:
  calibration.csv: ecefce0dce8cc6051d7d24e16b8db0524cfd34deffdc52325ab40005f0152bbd
  test.csv: b3e7b3ff890bb02ff52c66b877f4dab16e0c4b43fb9c9dab2ffbfb79c70a2102
  train.csv: 9c978ee7e2090db91c36ec431744a34d95678e38008a4f5dfd74227555a03cf2
