name: edge_iiot
version: 1.0.0
description: Edge-IIoTSet (industrial IoT attack flows)

source:
  kind: concat_csvs                            # changed from `url` so the
                                               # cached_at is a directory
                                               # (auto-download via download_url
                                               # extracts into a directory).
  cached_at: raw/edge_iiotset/
  # Edge-IIoTSet's official Mendeley/Kaggle distribution requires JS-
  # rendered or login-gated downloads. The HuggingFace mirror at
  # `Sunayanajagadesh/ML_EdgeIIoT_dataset` carries the canonical
  # `ml_edgeiiot.csv` (82 MB) — same content as the original, just
  # renamed to `ML-EdgeIIoT-dataset.csv` upstream.
  download_url: https://huggingface.co/datasets/Sunayanajagadesh/ML_EdgeIIoT_dataset/resolve/main/ML-EdgeIIoT-dataset.csv

label:
  source_column: Attack_type
  rename_to: label
  normalize: lowercase_underscore
  # `Attack_label` is the binary sibling target of Attack_type — drop it
  # as a label, not a feature.
  also_drop: [Attack_label]

pipeline:
  # High-entropy payload / URI fields that are free-text or per-flow
  # unique (effectively identifiers). `icmp.transmit_timestamp` is an
  # in-payload clock, not a standard capture-time column name, so it is
  # listed explicitly rather than left to drop_timestamp_columns.
  - op: drop_columns
    columns:
      - icmp.transmit_timestamp
      - mqtt.msg
      - http.file_data
      - http.request.full_uri
      - http.request.uri.query
      - tcp.payload
      - tcp.options
  - op: drop_ip_columns                  # ip.src_host/ip.dst_host + arp.*.proto_ipv4
  - op: drop_timestamp_columns           # frame.time (capture wall-clock)
  - op: encode_categoricals
    max_cardinality: 50
    method: onehot
  - op: coerce_numeric
  - op: replace_inf
  - op: drop_high_nan_columns
    threshold: 0.8
  - op: fill_nan
    value: 0
  - op: filter_min_class_count
    min_count: 50
  # Standardised 5% stratified benchmark slice — preserves the
  # upstream class proportions (no rebalancing).
  - op: stratified_fraction_sample
    fraction: 0.05
    seed: 42

split:
  kind: stratified_class_balanced
  train_frac: 0.6
  cal_frac:   0.2
  test_frac:  0.2
  seed: 42

output:
  format: csv
  precision: 6
  column_sort: alphabetical
  row_shuffle_seed: 42

