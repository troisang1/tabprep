name: ciciot2023
version: 1.0.0
description: CIC-IoT-2023 (per-device flow CSVs concatenated)

source:
  kind: concat_csvs
  cached_at: raw/ciciot2023/

label:
  source_column: label
  rename_to: label
  normalize: lowercase_underscore

pipeline:
  - op: strip_column_whitespace
  - op: filter_rows_label_isnull
  - op: drop_ip_columns
  - op: encode_categoricals
    max_cardinality: 50
    method: onehot
  - op: coerce_numeric
  - op: replace_inf
  - op: drop_high_nan_columns
    threshold: 0.8
  - op: fill_nan
    value: 0
  - op: filter_min_class_count
    min_count: 50
  - op: balanced_subsample
    max_total: 1000000                         # cap at 1M rows for tractability
    seed: 42

split:
  kind: stratified_class_balanced
  train_frac: 0.6
  cal_frac:   0.2
  test_frac:  0.2
  seed: 42

output:
  format: csv
  precision: 6
  column_sort: alphabetical
  row_shuffle_seed: 42

expected_hashes:
