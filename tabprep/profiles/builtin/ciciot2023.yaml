name: ciciot2023
version: 1.0.0
description: CIC-IoT-2023 (per-device flow CSVs concatenated)

source:
  kind: concat_csvs
  cached_at: raw/ciciot2023/
  # UNB CIC's direct URLs are locked down post-2025. The Kaggle public
  # mirror `akashdogra/cic-iot-2023` (~2.77 GB ZIP) carries the
  # canonical Spark-merged shard layout (`part-NNNNN-...c000.csv`,
  # 169 files, byte-equivalent to the user's existing raw). Kaggle
  # serves CC-BY datasets without auth via the `/api/v1/datasets/download/`
  # endpoint.
  download_url: https://www.kaggle.com/api/v1/datasets/download/akashdogra/cic-iot-2023
  archive_format: zip

label:
  source_column: label
  rename_to: label
  normalize: lowercase_underscore

pipeline:
  - op: strip_column_whitespace
  - op: filter_rows_label_isnull
  - op: drop_ip_columns
  - op: encode_categoricals
    max_cardinality: 50
    method: onehot
  - op: coerce_numeric
  - op: replace_inf
  - op: drop_high_nan_columns
    threshold: 0.8
  - op: fill_nan
    value: 0
  - op: filter_min_class_count
    min_count: 50
  # Standardised 5% stratified benchmark slice — preserves the
  # upstream class proportions (no rebalancing).
  - op: stratified_fraction_sample
    fraction: 0.05
    seed: 42

split:
  kind: stratified_class_balanced
  train_frac: 0.6
  cal_frac:   0.2
  test_frac:  0.2
  seed: 42

output:
  format: csv
  precision: 6
  column_sort: alphabetical
  row_shuffle_seed: 42

