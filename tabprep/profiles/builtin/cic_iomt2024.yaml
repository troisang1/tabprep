name: cic_iomt2024
version: 1.0.0
description: |
  CIC-IoMT-2024 (UNB CIC, 2024) — Internet of Medical Things attack
  flows. 19 attack types across 6 families (DDoS, DoS, Recon, MQTT,
  Spoofing, Benign), ~45 CICFlowMeter-family features, ~18M flows.
  WiFi-MQTT and Bluetooth sub-trees are concatenated under one profile;
  drop_high_nan_columns drops fields that exist in only one tree.

source:
  kind: concat_csvs
  cached_at: raw/cic_iomt2024/
  # ── MANUAL DOWNLOAD REQUIRED (Kaggle mirror has incompatible schema) ──
  # UNB CIC's direct URLs are locked down post-2025. The Kaggle mirror
  # `zeynepdemirta/ciciomt2024-attacks` / `ciciomt2024-profilling` exists
  # and is curl-able without auth, BUT the CSVs there don't carry a
  # `label` column — the label is encoded in the filename (e.g.,
  # `ARP_Spoofing_test.pcap.csv`). Auto-fetching that Kaggle mirror
  # requires a custom filename-label loader (similar to `nbaiot_dir`),
  # which is future work.
  #
  # For now: visit https://www.unb.ca/cic/datasets/iomt-dataset-2024.html,
  # complete the licence form (CIC emails a one-time link), download the
  # CSV-only subset that includes a `label` column, and place it under
  # raw/cic_iomt2024/.

label:
  source_column: label
  rename_to: label
  normalize: lowercase_underscore

pipeline:
  - op: strip_column_whitespace
  - op: filter_rows_label_isnull
  - op: drop_ip_columns
  - op: encode_categoricals
    max_cardinality: 50
    method: onehot
  - op: coerce_numeric
  - op: replace_inf
  - op: drop_high_nan_columns
    threshold: 0.8
  - op: fill_nan
    value: 0
  - op: filter_min_class_count
    min_count: 50
  - op: balanced_subsample
    max_total: 1000000
    seed: 42

split:
  kind: stratified_class_balanced
  train_frac: 0.6
  cal_frac:   0.2
  test_frac:  0.2
  seed: 42

output:
  format: csv
  precision: 6
  column_sort: alphabetical
  row_shuffle_seed: 42

# expected_hashes: pin after the first canonical run.
