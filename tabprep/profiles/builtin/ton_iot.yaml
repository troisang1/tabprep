name: ton_iot
version: 1.0.0
description: ToN-IoT network attack flows, multi-class

source:
  kind: concat_csvs                            # changed from `url` so cached_at
                                               # is a directory (auto-download
                                               # extracts files into a directory).
  cached_at: raw/ton_iot/train_test/
  # UNSW's official SharePoint URL is session-bound (returns 403 to
  # non-browser clients). The HuggingFace mirror at
  # `codymlewis/TON_IoT_network` carries the canonical
  # `train_test_network.csv` (29.9 MB) — byte-equivalent to the UNSW
  # original (sizes match exactly).
  download_url: https://huggingface.co/datasets/codymlewis/TON_IoT_network/resolve/main/train_test_network.csv

label:
  source_column: type
  rename_to: label
  normalize: lowercase_underscore

pipeline:
  # Note: the original binary `label` column is dropped automatically
  # when the `type` column is renamed to `label` (see rename_label op).
  - op: drop_constant_prefix_columns
    prefixes: [dns_, ssl_, http_, weird_]
  - op: drop_ip_columns
  - op: drop_timestamp_columns           # `ts` if the mirror carries it
  - op: encode_categoricals
    max_cardinality: 50
    method: onehot
  - op: coerce_numeric
  - op: replace_inf
  - op: drop_high_nan_columns
    threshold: 0.8
  - op: fill_nan
    value: 0
  - op: filter_min_class_count
    min_count: 50
  # Standardised 5% stratified benchmark slice — preserves the
  # upstream class proportions (no rebalancing).
  - op: stratified_fraction_sample
    fraction: 0.05
    seed: 42

split:
  kind: stratified_class_balanced
  train_frac: 0.6
  cal_frac:   0.2
  test_frac:  0.2
  seed: 42

output:
  format: csv
  precision: 6
  column_sort: alphabetical
  row_shuffle_seed: 42

