name: cic_ddos2019
version: 1.0.0
description: |
  CIC-DDoS-2019 (Sharafaldin et al., UNB) — fine-grained DDoS taxonomy
  across 12 reflection / amplification attack types plus benign. Single
  CICFlowMeter family, 80+ flow features. ~50M flows total — heavily
  subsampled here for tractable benchmark use.

source:
  kind: concat_csvs
  cached_at: raw/cic_ddos2019/
  # `url` (encoding) intentionally unset — concat_csvs auto-falls
  # through utf-8 → latin-1 → cp1252 per file, and CIC-DDoS-2019 mixes
  # encodings across its CSVs/01-12 vs CSVs/03-11 sub-trees.
  #
  # ── MANUAL DOWNLOAD REQUIRED ────────────────────────────────────────
  # As of 2026-04, CIC has locked down all direct-download URLs
  # (cicresearch.ca and 205.174.165.80) — every path 302-redirects to
  # the licence-acceptance form. tabprep cannot auto-download this.
  #
  # To reproduce this profile:
  #   1. Visit https://www.unb.ca/cic/datasets/ddos-2019.html
  #   2. Click "Download" and complete the licence form. CIC emails
  #      you a one-time download link (or a Google Drive folder).
  #   3. Download the CSV folders ONLY (skip PCAPs — multi-TB and not
  #      used by this profile). The relevant directories are
  #      `Dataset/CSVs/01-12/` and `Dataset/CSVs/03-11/`.
  #   4. Drop the entire downloaded structure under data/raw/cic_ddos2019/.
  #      No flattening required — concat_csvs walks the tree recursively.
  #
  # Once the raw CSVs are in place, run:
  #   tabprep prepare --profile profiles/builtin/cic_ddos2019.yaml
  #   python scripts/pin_hashes.py --profile profiles/builtin/cic_ddos2019.yaml

label:
  source_column: Label
  rename_to: label
  normalize: lowercase_underscore

pipeline:
  - op: strip_column_whitespace
  - op: filter_rows_label_isnull
  - op: drop_ip_columns
  - op: encode_categoricals
    max_cardinality: 50
    method: onehot
  - op: coerce_numeric
  - op: replace_inf
  - op: drop_high_nan_columns
    threshold: 0.8
  - op: fill_nan
    value: 0
  - op: filter_min_class_count
    min_count: 50
  - op: balanced_subsample
    max_total: 1000000                          # cap at 1M rows for tractability
    seed: 42

split:
  kind: stratified_class_balanced
  train_frac: 0.6
  cal_frac:   0.2
  test_frac:  0.2
  seed: 42

output:
  format: csv
  precision: 6
  column_sort: alphabetical
  row_shuffle_seed: 42

# expected_hashes: pin after the first canonical run via
#   tabprep prepare --profile profiles/builtin/cic_ddos2019.yaml
#   python scripts/pin_hashes.py --profile profiles/builtin/cic_ddos2019.yaml
