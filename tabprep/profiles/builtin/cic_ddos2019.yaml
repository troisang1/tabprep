name: cic_ddos2019
version: 1.0.0
description: |
  CIC-DDoS-2019 (Sharafaldin et al., UNB) — fine-grained DDoS taxonomy
  across 12 reflection / amplification attack types plus benign. Single
  CICFlowMeter family, 80+ flow features. ~50M flows total — heavily
  subsampled here for tractable benchmark use.

source:
  kind: concat_csvs
  cached_at: raw/cic_ddos2019/
  # `url` (encoding) intentionally unset — concat_csvs auto-falls
  # through utf-8 → latin-1 → cp1252 per file, and CIC-DDoS-2019 mixes
  # encodings across its CSVs/01-12 vs CSVs/03-11 sub-trees.
  #
  # UNB CIC's official URLs are locked down post-2025; the dataset is
  # mirrored on Kaggle as `rodrigorosasilva/cic-ddos2019-30gb-full-dataset-csv-files`
  # (~3 GB zipped, ~30 GB extracted, 19 CSVs in `01-12/` + `03-11/`).
  # Kaggle's `/api/v1/datasets/download/` serves CC-BY datasets via GET
  # without auth (HEAD returns 404 — Kaggle quirk; framework uses GET).
  download_url: https://www.kaggle.com/api/v1/datasets/download/rodrigorosasilva/cic-ddos2019-30gb-full-dataset-csv-files
  archive_format: zip
  # RAM guard: the 19 CSVs total ~30 GB extracted; reading whole would
  # exceed RAM on most hosts. Per-file head-N caps the load at
  # 19 × 200 000 ≈ 3.8M rows, well within memory and still ~4× the
  # downstream `balanced_subsample max_total: 1_000_000` so the cap
  # does not bias the final distribution. `memory_budget_gb=24` is a
  # hard ceiling — the loader aborts before swap thrashes.
  # `sample=stratified_by_label` does a two-pass class-aware cap: pass 1
  # streams only the ` Label` column to bin row indices by class, pass 2
  # rereads with the sampled rows. Guarantees BENIGN survives even when a
  # CIC CSV begins with a long run of attack rows. The CIC distros use a
  # ` Label` header (leading whitespace); the explicit `sample_label_col`
  # token preserves it verbatim.
  glob: "*.csv|max_rows_per_file=200000|sample=stratified_by_label|sample_label_col= Label|memory_budget_gb=16"

label:
  source_column: " Label"                       # Kaggle mirror keeps UNB's
                                                # leading whitespace on this
                                                # column (CIC CSVs traditionally
                                                # ship column names with a
                                                # leading space). Quoted YAML
                                                # string preserves the space;
                                                # rename_label runs before the
                                                # `strip_column_whitespace` op
                                                # in the pipeline below.
  rename_to: label
  normalize: lowercase_underscore

pipeline:
  - op: strip_column_whitespace
  - op: filter_rows_label_isnull
  - op: drop_ip_columns
  - op: drop_timestamp_columns           # Timestamp (CICFlowMeter capture time)
  - op: encode_categoricals
    max_cardinality: 50
    method: onehot
  - op: coerce_numeric
  - op: replace_inf
  - op: drop_high_nan_columns
    threshold: 0.8
  - op: fill_nan
    value: 0
  - op: filter_min_class_count
    min_count: 50
  # Standardised 5% stratified benchmark slice — preserves the
  # upstream class proportions (no rebalancing).
  - op: stratified_fraction_sample
    fraction: 0.05
    seed: 42

split:
  kind: stratified_class_balanced
  train_frac: 0.6
  cal_frac:   0.2
  test_frac:  0.2
  seed: 42

output:
  format: csv
  precision: 6
  column_sort: alphabetical
  row_shuffle_seed: 42

# expected_hashes: pin after the first canonical run via
#   tabprep prepare --profile profiles/builtin/cic_ddos2019.yaml
#   python scripts/pin_hashes.py --profile profiles/builtin/cic_ddos2019.yaml
