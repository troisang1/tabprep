name: unsw_nb15
version: 1.0.0
description: UNSW-NB15 network intrusion (multi-class via attack_cat)

# v0.5 schema: the dedicated `unsw_nb15` loader injects the published
# 49-column schema before reading because the upstream CSVs are
# headerless (the legacy `concat_csvs` source consumed the first data
# row as column names and so couldn't find `attack_cat`).
downloader: unsw_nb15
loader: unsw_nb15
cached_at: raw/unsw_nb15/
loader_options:
  max_rows_per_file: 1000000      # bound RAM on the largest CSV (~4 GB
                                  # raw); 4 × 1M = 4M rows total — well
                                  # above the downstream onehot/split
                                  # working set on a 24 GiB host.
  sample_mode: head
  sample_seed: 42
  memory_budget_gb: 16

label:
  source_column: attack_cat
  rename_to: label
  normalize: lowercase_underscore

pipeline:
  # The binary `Label` column is the *other* upstream target. Drop it
  # explicitly so it doesn't leak into the feature set after attack_cat
  # is renamed to `label`.
  - op: drop_columns
    columns: [Label]
  - op: filter_rows_label_isnull
  - op: drop_ip_columns
  - op: encode_categoricals
    max_cardinality: 50
    method: onehot
  - op: coerce_numeric
  - op: replace_inf
  - op: drop_high_nan_columns
    threshold: 0.8
  - op: fill_nan
    value: 0
  - op: filter_min_class_count
    min_count: 50

split:
  kind: stratified_class_balanced
  train_frac: 0.6
  cal_frac:   0.2
  test_frac:  0.2
  seed: 42

output:
  format: csv
  precision: 6
  column_sort: alphabetical
  row_shuffle_seed: 42

# expected_hashes intentionally unset: the previous pin was generated
# from a broken load (the legacy `concat_csvs` path treated the first
# data row as the header and produced a different — invalid — frame).
# Re-pin after the first canonical run via:
#   tabprep prepare --profile profiles/builtin/unsw_nb15.yaml
#   python scripts/pin_hashes.py --profile profiles/builtin/unsw_nb15.yaml
