name: 5g_nidd
version: 1.0.0
description: 5G-NIDD multi-class network attack flows (8 classes)

source:
  kind: concat_csvs                            # changed from `url` so cached_at
                                               # is a directory (auto-download
                                               # extracts ZIP into a directory).
  cached_at: raw/5g_nidd/
  # The Aalto research portal page is 404 and IEEE DataPort requires
  # subscription. The Kaggle public mirror `humera11/5g-nidd-dataset`
  # carries the canonical `Combined.csv` (262 MB) under a 31 MB ZIP.
  # Kaggle's `/api/v1/datasets/download/...` endpoint serves CC-BY
  # datasets without auth (returns ZIP via GET, 404 on HEAD).
  download_url: https://www.kaggle.com/api/v1/datasets/download/humera11/5g-nidd-dataset
  archive_format: zip

label:
  source_column: Attack Type
  rename_to: label
  normalize: lowercase_underscore
  # `Label` (binary) and `Attack Tool` are sibling targets of Attack Type
  # — `Attack Tool` in particular all but names the attack. Drop as labels.
  also_drop: ["Label", "Attack Tool"]

pipeline:
  - op: drop_columns
    columns: ["Unnamed: 0", "Seq"]          # row index + capture sequence id
  - op: drop_ip_columns
  - op: encode_categoricals
    max_cardinality: 50
    method: onehot
  - op: coerce_numeric
  - op: replace_inf
  - op: drop_high_nan_columns
    threshold: 0.8
  - op: fill_nan
    value: 0
  - op: filter_min_class_count
    min_count: 50
  # Standardised 5% stratified benchmark slice — preserves the
  # upstream class proportions (no rebalancing).
  - op: stratified_fraction_sample
    fraction: 0.05
    seed: 42

split:
  kind: stratified_class_balanced
  train_frac: 0.6
  cal_frac:   0.2
  test_frac:  0.2
  seed: 42

output:
  format: csv
  precision: 6
  column_sort: alphabetical
  row_shuffle_seed: 42

