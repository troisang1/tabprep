name: nbaiot
version: 1.0.0
description: N-BaIoT IoT botnet traffic (per-attack-family CSVs, label from filename)

source:
  kind: nbaiot_dir
  cached_at: raw/nbaiot/
  # The UCI primary distribution ships the attack traffic inside
  # `gafgyt_attacks.rar` / `mirai_attacks.rar` archives — a `.rar`
  # extraction step is not part of this framework's pipeline. The
  # Kaggle mirror `mkashifn/nbaiot-dataset` carries the SAME 93 CSVs
  # pre-extracted in a flat layout (~894 MB ZIP, ~3.8 GB extracted),
  # keyed as `<device-id>.<family>.<attack>.csv` plus
  # `<device-id>.benign.csv`. Kaggle's `/api/v1/datasets/download/...`
  # serves CC-BY datasets without auth via GET (HEAD returns 404 —
  # Kaggle quirk; framework uses GET).
  download_url: https://www.kaggle.com/api/v1/datasets/download/mkashifn/nbaiot-dataset
  archive_format: zip

label:
  source_column: label                         # set by the source loader
  rename_to: label
  normalize: lowercase_underscore

pipeline:
  - op: drop_ip_columns
  - op: encode_categoricals
    max_cardinality: 50
    method: onehot
  - op: coerce_numeric
  - op: replace_inf
  - op: drop_high_nan_columns
    threshold: 0.8
  - op: fill_nan
    value: 0
  - op: filter_min_class_count
    min_count: 50

split:
  kind: stratified_class_balanced
  train_frac: 0.6
  cal_frac:   0.2
  test_frac:  0.2
  seed: 42

output:
  format: csv
  precision: 6
  column_sort: alphabetical
  row_shuffle_seed: 42

# expected_hashes intentionally unset: the previous pin was generated
# from the UCI distribution (which our loader could no longer ingest
# end-to-end because the attack traffic was inside un-extractable
# `.rar` archives). The Kaggle mirror produces a different — but
# valid — concatenation, so the prior hashes do not apply. Re-pin
# after the first canonical run via:
#   tabprep prepare --profile profiles/builtin/nbaiot.yaml
#   python scripts/pin_hashes.py --profile profiles/builtin/nbaiot.yaml
