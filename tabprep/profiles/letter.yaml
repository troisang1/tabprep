name: letter
version: 1.0.0
description: Letter recognition (26 classes, 16 features) — OpenML

downloader: openml
loader: openml
cached_at: raw/openml/letter/
loader_options:
  openml_name: letter
  openml_version: 1

label:
  source_column: label
  rename_to: label
  normalize: lowercase_underscore

pipeline:
  - op: rename_features_f0fN
  - op: filter_min_class_count
    min_count: 50
  - op: balanced_subsample
    max_total: 10000
    seed: 42

split:
  kind: stratified_class_balanced
  train_frac: 0.5
  cal_frac:   0.1
  test_frac:  0.4
  seed: 42

output:
  format: csv
  precision: 6
  column_sort: alphabetical
  row_shuffle_seed: 42

expected_hashes:
  calibration.csv: 3d68fa7ba96c0c148952e787b813fc63fdeb189859ef9a513207a7db526457fa
  test.csv: 4fbd8216f7d87f33edfa8fa68bea383b23c7297e656114b75ad130f195daa9c4
  train.csv: 489fcf7266ce69ef0548bc240356584f4bf98a641c812f68b2dd38bc3ee96161
