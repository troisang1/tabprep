name: covertype
version: 1.0.0
description: Forest cover type (7 classes, 54 features) — sklearn fetch_covtype

# v0.5 schema. Standalone package (not part of the openml/ family)
# because fetch_covtype has a different signature than fetch_openml
# and an as_frame=True/ndarray normalisation step is required.
downloader: covertype
loader: covertype
cached_at: raw/covertype/
loader_options: {}

label:
  source_column: label
  rename_to: label
  normalize: lowercase_underscore

pipeline:
  - op: rename_features_f0fN
  - op: filter_min_class_count
    min_count: 50
  # Standardised 5% stratified benchmark slice — preserves the
  # upstream class proportions (no rebalancing).
  - op: stratified_fraction_sample
    fraction: 0.05
    seed: 42

split:
  kind: stratified_class_balanced
  train_frac: 0.5
  cal_frac:   0.1
  test_frac:  0.4
  seed: 42

output:
  format: csv
  precision: 6
  column_sort: alphabetical
  row_shuffle_seed: 42

