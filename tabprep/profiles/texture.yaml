name: texture
version: 1.0.0
description: Texture image classification (11 classes, 40 features) — OpenML

downloader: openml
loader: openml
cached_at: raw/openml/texture/
loader_options:
  openml_name: texture
  openml_version: 1

label:
  source_column: label
  rename_to: label
  normalize: lowercase_underscore

pipeline:
  - op: rename_features_f0fN
  - op: filter_min_class_count
    min_count: 50

split:
  kind: stratified_class_balanced
  train_frac: 0.5
  cal_frac:   0.1
  test_frac:  0.4
  seed: 42

output:
  format: csv
  precision: 6
  column_sort: alphabetical
  row_shuffle_seed: 42

expected_hashes:
  calibration.csv: 7d881d9e93f6ad7efefe55156f868dc8dd1e22730b0a08e53b8b179289920d15
