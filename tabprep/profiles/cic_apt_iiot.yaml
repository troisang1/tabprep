name: cic_apt_iiot
version: 1.0.0
description: |
  CIC-APT-IIoT-2024 (UNB CIC, 2024) — Advanced Persistent Threat in
  Industrial IoT. Multi-stage kill-chain labels (recon → weaponisation
  → delivery → exploitation → installation → C2 → actions). Newest CIC
  release; complements CIC-IDS2018 (enterprise) and CIC-IoT-2023 (consumer IoT).

  Auto-fetched from Kaggle public mirror `waqarkha/cicapt-iiot`
  (2.4 GB ZIP → 2 phase CSVs, 9.7 GB extracted). UNB's official IP
  mirror is locked down post-2025 (returns email-token-only); the
  Kaggle mirror carries the same distribution with the `label`
  column. See `tabprep/datasets/cic_apt_iiot/README.md`.

downloader: cic_apt_iiot
loader: cic_apt_iiot
cached_at: raw/cic_apt_iiot/
# RAM guard: phase1+phase2 CSVs total ~9 GB raw and after one-hot
# encoding the working set on a 24 GB host blew past available RAM
# in the previous stress run. Per-file head-N caps both at 1M rows
# (≈2M rows total) which fits comfortably and is still ~4× the
# downstream `balanced_subsample max_total: 500_000` so the cap is
# distribution-neutral. `memory_budget_gb=16` aborts cleanly if RSS
# climbs further (e.g. on smaller hosts).
loader_options:
  max_rows_per_file: 1000000
  sample_mode: head
  sample_seed: 42
  memory_budget_gb: 16

label:
  source_column: label                          # Kaggle mirror uses lowercase
                                                # (UNB's original CSVs had
                                                # `Label` capitalised, but the
                                                # `waqarkha/cicapt-iiot` Kaggle
                                                # repack is `label`).
  rename_to: label
  normalize: lowercase_underscore

pipeline:
  - op: strip_column_whitespace
  - op: drop_ip_columns                    # CIC CSVs include flow IDs / IPs
  - op: drop_columns
    columns: [Flow ID, Timestamp]
  - op: encode_categoricals
    max_cardinality: 50
    method: onehot
  - op: coerce_numeric
  - op: replace_inf
  - op: drop_high_nan_columns
    threshold: 0.8
  - op: fill_nan
    value: 0
  - op: filter_min_class_count
    min_count: 50
  - op: balanced_subsample
    max_total: 500000
    seed: 42

split:
  kind: stratified_class_balanced
  train_frac: 0.6
  cal_frac:   0.2
  test_frac:  0.2
  seed: 42

output:
  format: csv
  precision: 6
  column_sort: alphabetical
  row_shuffle_seed: 42

# expected_hashes pinned after the first canonical run.
