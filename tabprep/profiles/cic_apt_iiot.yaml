name: cic_apt_iiot
version: 1.0.0
description: |
  CIC-APT-IIoT-2024 (UNB CIC, 2024) — Advanced Persistent Threat in
  Industrial IoT. Multi-stage kill-chain labels (recon → weaponisation
  → delivery → exploitation → installation → C2 → actions). Newest CIC
  release; complements CIC-IDS2018 (enterprise) and CIC-IoT-2023 (consumer IoT).

  Auto-fetched from Kaggle public mirror `waqarkha/cicapt-iiot`
  (2.4 GB ZIP → 2 phase CSVs, 9.7 GB extracted). UNB's official IP
  mirror is locked down post-2025 (returns email-token-only); the
  Kaggle mirror carries the same distribution with the `label`
  column. See `tabprep/datasets/cic_apt_iiot/README.md`.

downloader: cic_apt_iiot
loader: cic_apt_iiot
cached_at: raw/cic_apt_iiot/
loader_options: {}

label:
  source_column: Label
  rename_to: label
  normalize: lowercase_underscore

pipeline:
  - op: strip_column_whitespace
  - op: drop_ip_columns                    # CIC CSVs include flow IDs / IPs
  - op: drop_columns
    columns: [Flow ID, Timestamp]
  - op: encode_categoricals
    max_cardinality: 50
    method: onehot
  - op: coerce_numeric
  - op: replace_inf
  - op: drop_high_nan_columns
    threshold: 0.8
  - op: fill_nan
    value: 0
  - op: filter_min_class_count
    min_count: 50
  - op: balanced_subsample
    max_total: 500000
    seed: 42

split:
  kind: stratified_class_balanced
  train_frac: 0.6
  cal_frac:   0.2
  test_frac:  0.2
  seed: 42

output:
  format: csv
  precision: 6
  column_sort: alphabetical
  row_shuffle_seed: 42

# expected_hashes pinned after the first canonical run.
