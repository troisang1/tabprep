name: cic_iomt2024
version: 1.0.0
description: |
  CIC-IoMT-2024 (UNB CIC, 2024) — Internet of Medical Things attack
  flows. Multi-class taxonomy across MQTT, TCP/IP, ARP, and Recon
  attack families plus Benign baseline.

  Distribution: UNB's official mirror is locked down (2025+); this
  profile auto-fetches the Kaggle public mirror
  `zeynepdemirta/ciciomt2024-attacks` (~281 MB ZIP). Each per-pcap
  CSV has no `label` column — the loader derives the label from
  the filename (`ARP_Spoofing_test.pcap.csv` → `ARP_Spoofing`).

downloader: cic_iomt2024
loader: cic_iomt2024
cached_at: raw/cic_iomt2024/
loader_options: {}

label:
  source_column: label
  rename_to: label
  normalize: lowercase_underscore

pipeline:
  - op: strip_column_whitespace
  - op: drop_ip_columns
  - op: encode_categoricals
    max_cardinality: 50
    method: onehot
  - op: coerce_numeric
  - op: replace_inf
  - op: drop_high_nan_columns
    threshold: 0.8
  - op: fill_nan
    value: 0
  - op: filter_min_class_count
    min_count: 50
  - op: balanced_subsample
    max_total: 1000000
    seed: 42

split:
  kind: stratified_class_balanced
  train_frac: 0.6
  cal_frac:   0.2
  test_frac:  0.2
  seed: 42

output:
  format: csv
  precision: 6
  column_sort: alphabetical
  row_shuffle_seed: 42

# expected_hashes: pin after the first canonical run.
