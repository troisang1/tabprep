name: CI

# Three jobs:
#  - lint:      ruff style/static checks (fast, every push)
#  - test:      pytest smoke tests on a Python matrix (3.10–3.12)
#  - reproduce: run `tabprep prepare --all --source-kinds openml,sklearn`
#               followed by `tabprep verify --all --source-kinds openml,sklearn`,
#               which exercises the 8 UCI profiles end-to-end and asserts
#               byte-stable outputs against the pinned `expected_hashes`.
#
# IDS profiles are NOT run in CI: their raw datasets are large (multi-GB)
# and licence-restricted, so they cannot be re-fetched from a fresh
# checkout. Their reproducibility is exercised manually before each
# release; the maintainer's local outputs are kept as the canonical
# reference.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: ruff lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install "ruff>=0.4"
      - name: ruff check
        run: ruff check tabprep tests

  test:
    name: pytest (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run tests
        run: pytest -q

  reproduce:
    name: UCI reproducibility (8 profiles)
    runs-on: ubuntu-latest
    needs: [lint, test]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Cache OpenML / sklearn data
        uses: actions/cache@v4
        with:
          path: |
            ~/scikit_learn_data
          key: openml-sklearn-${{ hashFiles('profiles/builtin/*.yaml') }}
          restore-keys: |
            openml-sklearn-
      - name: Prepare all UCI profiles
        run: |
          python -m tabprep prepare \
            --all --source-kinds openml,sklearn \
            --output-root prepared
      - name: Verify all UCI profiles
        run: |
          python -m tabprep verify \
            --all --source-kinds openml,sklearn \
            --output-root prepared
      - name: Show output sizes
        run: |
          du -sh prepared/* | sort -h
