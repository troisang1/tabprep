name: 5g_nidd
version: 1.0.0
description: 5G-NIDD multi-class network attack flows (8 classes)

source:
  kind: url
  url: "https://research.aalto.fi/en/datasets/5g-nidd-a-comprehensive-network-intrusion-detection-dataset"
  cached_at: raw/5g_nidd/Combined.csv
  # sha256 left blank — fill in once a stable upstream snapshot is identified.

label:
  source_column: Attack Type
  rename_to: label
  normalize: lowercase_underscore

pipeline:
  - op: drop_columns
    columns: ["Unnamed: 0", "Seq", "Label", "Attack Tool"]
  - op: drop_ip_columns
  - op: encode_categoricals
    max_cardinality: 50
    method: onehot
  - op: coerce_numeric
  - op: replace_inf
  - op: drop_high_nan_columns
    threshold: 0.8
  - op: fill_nan
    value: 0
  - op: filter_min_class_count
    min_count: 50

split:
  kind: stratified_class_balanced
  train_frac: 0.6
  cal_frac:   0.2
  test_frac:  0.2
  seed: 42

output:
  format: csv
  precision: 6
  column_sort: alphabetical
  row_shuffle_seed: 42

expected_hashes:
  calibration.csv: ab8fdf952899d8d2d6d0325fd0c47b277a2f94e67eb10171b297b9dca23358ff
  test.csv: a2952d468d788eec6de8a56ec4c0e823b889c1f26a78a4b9ce8b931265125a13
  train.csv: 85f76952b324d5247fc9d5e0b3b25120115d6c3bd41d1c250d97b81a3c184472
