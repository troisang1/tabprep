name: covertype
version: 1.0.0
description: Forest cover type (7 classes, 54 features) — sklearn fetch_covtype

source:
  kind: sklearn
  name: covertype

label:
  source_column: label
  rename_to: label
  normalize: lowercase_underscore

pipeline:
  - op: rename_features_f0fN
  - op: filter_min_class_count
    min_count: 50
  - op: balanced_subsample
    max_total: 10000
    seed: 42

split:
  kind: stratified_class_balanced
  train_frac: 0.5
  cal_frac:   0.1
  test_frac:  0.4
  seed: 42

output:
  format: csv
  precision: 6
  column_sort: alphabetical
  row_shuffle_seed: 42

