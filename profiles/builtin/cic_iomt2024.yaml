name: cic_iomt2024
version: 1.0.0
description: |
  CIC-IoMT-2024 (UNB CIC, 2024) — Internet of Medical Things attack
  flows. 19 attack types across 6 families (DDoS, DoS, Recon, MQTT,
  Spoofing, Benign), ~45 CICFlowMeter-family features, ~18M flows.
  WiFi-MQTT and Bluetooth sub-trees are concatenated under one profile;
  drop_high_nan_columns drops fields that exist in only one tree.

source:
  kind: concat_csvs
  cached_at: raw/cic_iomt2024/
  # ── MANUAL DOWNLOAD REQUIRED ────────────────────────────────────────
  # As of 2026-04, CIC has locked down all direct-download URLs — every
  # path 302-redirects to the licence form. tabprep cannot auto-download.
  #
  # To reproduce this profile:
  #   1. Visit https://www.unb.ca/cic/datasets/iomt-dataset-2024.html
  #   2. Click "Download" and complete the licence form. CIC emails you
  #      a one-time download link.
  #   3. Download the CSV-only subset (skip PCAPs). Both the WiFi-MQTT
  #      and Bluetooth sub-trees are merged here under one profile.
  #   4. Drop the entire downloaded structure under data/raw/cic_iomt2024/.
  #      No flattening required — concat_csvs walks the tree recursively
  #      and the schema-tolerant pd.concat aligns the WiFi-only and
  #      Bluetooth-only columns automatically.
  #
  # Once the raw CSVs are in place, run:
  #   tabprep prepare --profile profiles/builtin/cic_iomt2024.yaml
  #   python scripts/pin_hashes.py --profile profiles/builtin/cic_iomt2024.yaml

label:
  source_column: label
  rename_to: label
  normalize: lowercase_underscore

pipeline:
  - op: strip_column_whitespace
  - op: filter_rows_label_isnull
  - op: drop_ip_columns
  - op: encode_categoricals
    max_cardinality: 50
    method: onehot
  - op: coerce_numeric
  - op: replace_inf
  - op: drop_high_nan_columns
    threshold: 0.8
  - op: fill_nan
    value: 0
  - op: filter_min_class_count
    min_count: 50
  - op: balanced_subsample
    max_total: 1000000
    seed: 42

split:
  kind: stratified_class_balanced
  train_frac: 0.6
  cal_frac:   0.2
  test_frac:  0.2
  seed: 42

output:
  format: csv
  precision: 6
  column_sort: alphabetical
  row_shuffle_seed: 42

# expected_hashes: pin after the first canonical run.
