name: nbaiot
version: 1.0.0
description: N-BaIoT IoT botnet traffic (per-attack-family CSVs, label from filename)

source:
  kind: nbaiot_dir
  cached_at: raw/nbaiot/

label:
  source_column: label                         # set by the source loader
  rename_to: label
  normalize: lowercase_underscore

pipeline:
  - op: drop_ip_columns
  - op: encode_categoricals
    max_cardinality: 50
    method: onehot
  - op: coerce_numeric
  - op: replace_inf
  - op: drop_high_nan_columns
    threshold: 0.8
  - op: fill_nan
    value: 0
  - op: filter_min_class_count
    min_count: 50

split:
  kind: stratified_class_balanced
  train_frac: 0.6
  cal_frac:   0.2
  test_frac:  0.2
  seed: 42

output:
  format: csv
  precision: 6
  column_sort: alphabetical
  row_shuffle_seed: 42

expected_hashes:
