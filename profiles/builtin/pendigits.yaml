name: pendigits
version: 1.0.0
description: Pen-based handwritten digits (10 classes, 16 features)

source:
  kind: openml
  name: pendigits

label:
  source_column: label                  # set by the openml source loader
  rename_to: label
  normalize: lowercase_underscore

pipeline:
  - op: filter_min_class_count
    min_count: 50

split:
  kind: stratified_class_balanced
  train_frac: 0.6
  cal_frac:   0.2
  test_frac:  0.2
  seed: 42

output:
  format: csv
  precision: 6
  column_sort: alphabetical
  row_shuffle_seed: 42

expected_hashes:
